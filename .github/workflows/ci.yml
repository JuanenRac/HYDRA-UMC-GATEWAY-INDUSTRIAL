name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
        with:
          node-version: "22"
      - name: Bundle the gateway and smoke-test the production start (/health, secret policy)
        if: ${{ hashFiles('scripts/smoke.mjs') != '' }}
        run: |
          npm run bundle
          node scripts/smoke.mjs
      - name: Check the docker-compose.yml and Dockerfile structure
        if: ${{ hashFiles('tools/verify_compose.py') != '' }}
        run: python tools/verify_compose.py
      - name: Validate the compose file with Docker Compose
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        env:
          # placeholders so that the required variables resolve; nothing here is a real secret
          GATEWAY_JWT_SECRET: ci-placeholder-not-a-secret-ci-placeholder
          MQTT_AUTH_JSON: "[]"
          MQTT_ACL_JSON: "[]"
          MQTT_TLS_DIR: "./certs/mqtt"
        run: |
          # the build contexts are sibling checkouts; `config` only needs the folders to exist
          mkdir -p ../HYDRA-UMC-OPCUA-SERVER ../HYDRA-UMC-MQTT-BROKER ../HYDRA-UMC-MTCONNECT-ADAPTER
          docker compose config --quiet
          echo "DOCKER_COMPOSE_CONFIG=PASS"
