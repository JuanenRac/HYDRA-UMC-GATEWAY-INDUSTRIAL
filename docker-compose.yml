# This is the real integration point for the Industry 4.0 Gateway: it
# brings up all three protocol bridges (HYDRA-UMC-OPCUA-SERVER,
# HYDRA-UMC-MQTT-BROKER, HYDRA-UMC-MTCONNECT-ADAPTER) plus this repo's own
# aggregation surface (src/server.ts's GET /status) as one Docker network,
# on the same host ports each service already binds to standalone (see
# each child's own README.md / src/server.ts) - so the whole Gateway can
# be brought up with a single `docker compose up` during local development
# or on a factory-floor host, without hand-wiring four separate processes.
#
# Layout assumption: the four HYDRA-UMC-GATEWAY-INDUSTRIAL/OPCUA-SERVER/
# MQTT-BROKER/MTCONNECT-ADAPTER repos are checked out as sibling folders
# (the ecosystem's documented sibling-repository layout) - the three
# `context: ../...` paths below
# depend on that layout, not on any monorepo restructuring.
#
# Every service prints its own name/version/role/port to stdout on startup
# (`docker compose logs -f`), the gateway answers GET /health (is the process
# up) and GET /status (a real TCP/HTTP reachability probe of each child), and
# each image has a HEALTHCHECK of its own.
#
# Optional settings are passed through from the environment or a .env file
# next to this one (see .env.example); an unset one reaches the service as an
# empty value, which every service treats as "not configured". The robot
# roster source of the OPC-UA server and the MTConnect adapter is the
# HYDRA-UMC-SERVER: from inside a container that is not "localhost".
#
# A recreated container keeps its OPC-UA certificate and the gateway's audit
# trail in named volumes.

services:
  gateway-industrial:
    build:
      context: .
    container_name: hydra-umc-gateway-industrial
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      # A production gateway refuses to start without a real secret (see .env.example): POST /command is signed with it.
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET:?set GATEWAY_JWT_SECRET in .env (see .env.example)}
      # Set to make the gateway also require this audience in the token (keeps a token minted for another service out).
      - GATEWAY_JWT_AUDIENCE=${GATEWAY_JWT_AUDIENCE:-}
    volumes:
      - gateway-logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      - opcua-server
      - mqtt-broker
      - mtconnect-adapter
    restart: unless-stopped

  opcua-server:
    build:
      context: ../HYDRA-UMC-OPCUA-SERVER
    container_name: hydra-umc-opcua-server
    ports:
      - "4840:4840"
    environment:
      - NODE_ENV=production
      # The one account that may write SwarmOnline and MaintenanceMode; unset = nobody can.
      - OPCUA_ADMIN_USERNAME=${OPCUA_ADMIN_USERNAME:-}
      - OPCUA_ADMIN_PASSWORD=${OPCUA_ADMIN_PASSWORD:-}
      # 1 accepts every client certificate (a lab); otherwise move each client's certificate from rejected/ to trusted/certs/ in the volume.
      - OPCUA_AUTO_ACCEPT=${OPCUA_AUTO_ACCEPT:-}
      # The name your SCADA resolves, when it is not the container's own.
      - OPCUA_ALTERNATE_HOSTNAME=${OPCUA_ALTERNATE_HOSTNAME:-}
      # The robot roster source (HYDRA-UMC-SERVER) and a credential for it.
      - HYDRA_SERVER_URL=${HYDRA_SERVER_URL:-}
      - HYDRA_SERVER_TOKEN=${HYDRA_SERVER_TOKEN:-}
      - HYDRA_SERVER_USER=${HYDRA_SERVER_USER:-}
      - HYDRA_SERVER_PASSWORD=${HYDRA_SERVER_PASSWORD:-}
    volumes:
      - opcua-pki:/data/pki
    restart: unless-stopped

  mqtt-broker:
    build:
      context: ../HYDRA-UMC-MQTT-BROKER
    container_name: hydra-umc-mqtt-broker
    ports:
      - "1883:1883"
    environment:
      - NODE_ENV=production
      # A production broker refuses to start without credentials and an ACL (see .env.example and the broker's own docs).
      - MQTT_AUTH_JSON=${MQTT_AUTH_JSON:?set MQTT_AUTH_JSON in .env (see .env.example)}
      - MQTT_ACL_JSON=${MQTT_ACL_JSON:?set MQTT_ACL_JSON in .env (see .env.example)}
    restart: unless-stopped

  mtconnect-adapter:
    build:
      context: ../HYDRA-UMC-MTCONNECT-ADAPTER
    container_name: hydra-umc-mtconnect-adapter
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      # The machine source (HYDRA-UMC-SERVER) and a credential for it. Without it every DataItem is UNAVAILABLE.
      - HYDRA_UMC_SERVER_URL=${HYDRA_UMC_SERVER_URL:-}
      - HYDRA_UMC_SERVER_TOKEN=${HYDRA_UMC_SERVER_TOKEN:-}
      - HYDRA_UMC_SERVER_USER=${HYDRA_UMC_SERVER_USER:-}
      - HYDRA_UMC_SERVER_PASSWORD=${HYDRA_UMC_SERVER_PASSWORD:-}
      - HYDRA_UMC_ROBOT_ID=${HYDRA_UMC_ROBOT_ID:-}
    restart: unless-stopped

volumes:
  gateway-logs:
  opcua-pki:
